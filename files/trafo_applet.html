<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideální transformátor</title>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --text:#1c1f26; --muted:#6b7280; --line:#e5e7eb; --track:#eceef1;
  --pri:#3b82f6; --sec:#2fa866; --pow:#a78bfa; --core:#dcdde0; --coreline:#c4b5fd;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171c; --panel:#1b1e25; --text:#eceef2; --muted:#9aa1ad; --line:#2c303a; --track:#2b2f39;
    --pri:#60a5fa; --sec:#4ade80; --pow:#c4b5fd; --core:#3a3e49; --coreline:#7c6bd6; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5;padding:24px 16px 48px}
main{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{display:grid;grid-template-columns:minmax(260px,5fr) 6fr;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
@media(max-width:700px){.card{grid-template-columns:1fr}.left{border-right:0!important;border-bottom:1px solid var(--line)}}
.left{padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.formula{display:flex;align-items:center;justify-content:center;gap:10px;font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.5rem;min-height:130px;font-style:italic}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2}
.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 2px}
.frac span:last-child{padding:2px 6px 0}
sub{font-size:.65em;font-style:italic}
.ctrl{display:grid;grid-template-columns:90px 44px 1fr;align-items:center;gap:10px;font-size:.9rem;margin-top:10px}
.ctrl output{color:var(--muted);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:var(--track);border-radius:11px;outline-offset:3px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.right{padding:18px 14px 12px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.meters small{display:block;font-size:.78rem;color:var(--muted)}
.meters small i{display:block;height:2px;width:26px;margin:0 auto 2px;border-radius:2px}
.meters b{font-size:.9rem;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;margin-top:4px}
svg text{font-family:inherit;fill:var(--text)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <h1>Ideální transformátor</h1>
  <p class="sub">Převod napětí, proudu a výkonu.</p>

  <div class="card">
    <div class="left">
      <div class="formula" aria-label="p se rovná U1 lomeno U2 se rovná N1 lomeno N2">
        <span>p&nbsp;=</span>
        <span class="frac"><span>U<sub>1</sub></span><span>U<sub>2</sub></span></span>
        <span>=</span>
        <span class="frac"><span>N<sub>1</sub></span><span>N<sub>2</sub></span></span>
      </div>
      <div>
        <label class="ctrl"><span>Primární napětí U<sub>1</sub></span><output id="oU1"></output><input id="u1" type="range" min="10" max="400" step="1" value="230"></label>
        <label class="ctrl"><span>Převod p</span><output id="oN"></output><input id="n" type="range" min="0.1" max="5" step="0.05" value="0.5"></label>
      </div>
    </div>

    <div class="right">
      <div class="meters">
        <div><small><i style="background:var(--pri)"></i>U<sub>1</sub> (RMS)</small><b id="mU1"></b></div>
        <div><small><i style="background:var(--pow)"></i>Výkon</small><b id="mP"></b></div>
        <div><small><i style="background:var(--sec)"></i>U<sub>2</sub> (RMS)</small><b id="mU2"></b></div>
      </div>

      <svg viewBox="0 0 460 300" role="img" aria-label="Schéma transformátoru">
        <text x="147" y="44" text-anchor="middle" font-size="12" style="fill:var(--pri)">N<tspan font-size="9" dy="3">1</tspan></text>
        <text x="313" y="44" text-anchor="middle" font-size="12" style="fill:var(--sec)">N<tspan font-size="9" dy="3">2</tspan></text>

        <!-- wires -->
        <path d="M147 85 H50 V205 H147" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M313 85 H410 V205 H313" fill="none" stroke="var(--sec)" stroke-width="3" stroke-linejoin="round"/>
        <path id="flowP" d="M147 85 H50 V205 H147" fill="none" stroke="var(--bg)" stroke-opacity=".75" stroke-width="3" stroke-dasharray="3 13" stroke-linecap="round"/>
        <path id="flowS" d="M313 85 H410 V205 H313" fill="none" stroke="var(--bg)" stroke-opacity=".75" stroke-width="3" stroke-dasharray="3 13" stroke-linecap="round"/>

        <!-- source -->
        <circle cx="50" cy="145" r="19" fill="var(--bg)" stroke="var(--pri)" stroke-width="2.5"/>
        <path d="M38 145 q6 -12 12 0 t12 0" fill="none" stroke="var(--pri)" stroke-width="2"/>

        <!-- load -->
        <rect x="396" y="110" width="28" height="70" fill="var(--bg)"/>
        <path d="M410 110 v6 l-10 6 l20 12 l-20 12 l20 12 l-10 6 v6" fill="none" stroke="var(--sec)" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- core -->
        <path fill-rule="evenodd" fill="var(--core)" d="M150 60H310a22 22 0 0 1 22 22V208a22 22 0 0 1-22 22H150a22 22 0 0 1-22-22V82a22 22 0 0 1 22-22ZM178 95H282a12 12 0 0 1 12 12V183a12 12 0 0 1-12 12H178a12 12 0 0 1-12-12V107a12 12 0 0 1 12-12Z"/>
        <rect x="153" y="82" width="154" height="126" rx="14" fill="none" stroke="var(--coreline)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>
        <text x="230" y="140" text-anchor="middle" font-size="11" font-weight="600">N<tspan font-size="8" dy="2">1</tspan><tspan dy="-2"> : N</tspan><tspan font-size="8" dy="2">2</tspan></text>
        <text id="ratioTxt" x="230" y="158" text-anchor="middle" font-size="12" font-weight="700"></text>

        <!-- coils -->
        <path id="coilP" fill="none" stroke="var(--pri)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="coilS" fill="none" stroke="var(--sec)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- labels -->
        <text id="i1" x="48" y="72" font-size="12" font-weight="700" style="fill:var(--pri)"></text>
        <text id="i2" x="412" y="72" font-size="12" font-weight="700" text-anchor="end" style="fill:var(--sec)"></text>
        <text x="230" y="262" text-anchor="middle" font-size="12" id="modeTxt" font-weight="600"></text>
      </svg>
    </div>
  </div>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const fmt = (x, d=2) => x.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d});
  const coilPath = (cx, top, h, loops, amp) => {
    const steps = loops*24, pts = [];
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      pts.push((i?'L':'M') + (cx + amp*Math.sin(2*Math.PI*loops*t)).toFixed(1) + ' ' + (top + h*t).toFixed(1));
    }
    return pts.join(' ');
  };
  const N1 = 8;
  let speed1 = 0, speed2 = 0, off1 = 0, off2 = 0;

  function update(){
    const P = 1000; // konstantní výkon (W)
    const u1 = +$('u1').value, p = +$('n').value;
    const u2 = u1/p;           // p = U1/U2
    const i1 = P/u1, i2 = P/u2; // p = I2/I1

    $('oU1').textContent = fmt(u1,0)+' V';
    $('oN').textContent = fmt(p);
    $('mU1').textContent = fmt(u1,0)+' V';
    $('mU2').textContent = fmt(u2,u2<100?1:0)+' V';
    $('mP').textContent = fmt(P,1)+' W';
    $('i1').textContent = 'I₁ '+fmt(i1)+' A RMS';
    $('i2').textContent = 'I₂ '+fmt(i2)+' A RMS';
    $('ratioTxt').textContent = 'p = '+fmt(p);
    $('modeTxt').textContent = Math.abs(p-1)<0.025 ? 'Oddělovací (p = 1)' : (p<1 ? 'Zvyšující (U₂ > U₁)' : 'Snižující (U₂ < U₁)');

    const n2 = Math.max(2, Math.round(N1/p)); // N2 = N1/p
    $('coilP').setAttribute('d', coilPath(147,85,120,N1,10));
    $('coilS').setAttribute('d', coilPath(313,85,120,Math.min(n2,40),10));

    speed1 = Math.min(i1/3,12); speed2 = Math.min(i2/3,12);
  }
  ['u1','n'].forEach(id => $(id).addEventListener('input', update));

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(){
    off1 -= speed1*0.25; off2 += speed2*0.25;
    $('flowP').style.strokeDashoffset = off1;
    $('flowS').style.strokeDashoffset = off2;
    requestAnimationFrame(tick);
  }
  update();
  if(!reduce) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
