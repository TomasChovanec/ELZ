<text x="350" y="408" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Úbytky (zeleně, kresleno zvětšené) tvoří trojúhelník nakrátko natočený podle proudu Ī<tspan baseline-shift="sub" font-size="10">2</tspan>′.</text>
<text x="350" y="426" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Ū<tspan baseline-shift="sub" font-size="10">1</tspan> = Ū<tspan baseline-shift="sub" font-size="10">2</tspan>′ + ΔŪ<tspan baseline-shift="sub" font-size="10">Rk</tspan> + ΔŪ<tspan baseline-shift="sub" font-size="10">Xk</tspan> → při induktivní zátěži je Ū<tspan baseline-shift="sub" font-size="10">2</tspan>′ menší než Ū<tspan baseline-shift="sub" font-size="10">1</tspan>.</text>
