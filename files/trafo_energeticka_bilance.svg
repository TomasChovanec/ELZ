<text x="410" y="28" font-size="16" fill="#1c1f26" text-anchor="middle" font-weight="bold">Energetická bilance transformátoru</text>
<path d="M60,120 L640,120 L640,105 L700,160.0 L640,215 L640,200 L60,200 z" fill="#2a78d6" fill-opacity="0.18" stroke="#2a78d6" stroke-width="2"/>
<text x="110" y="156.0" font-size="20" fill="#2a78d6" text-anchor="middle" font-weight="bold" font-style="italic">P₁</text>
<text x="110" y="178.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">příkon ze sítě</text>
<text x="600" y="156.0" font-size="20" fill="#2a78d6" text-anchor="middle" font-weight="bold" font-style="italic">P₂</text>
<text x="600" y="178.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">výkon do zátěže</text>
<path d="M246,200 L246,240 L234,240 L260,262 L286,240 L274,240 L274,200 z" fill="#eb6834" fill-opacity="0.25" stroke="#eb6834" stroke-width="2"/>
<text x="260" y="284" font-size="15" fill="#eb6834" text-anchor="middle" font-weight="bold" font-style="italic">ΔP<tspan dy="4" font-size="75%">Fe</tspan><tspan dy="-4"> </tspan></text>
<text x="260" y="302" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">ztráty v železe → teplo</text>
<path d="M416,200 L416,240 L404,240 L430,262 L456,240 L444,240 L444,200 z" fill="#eb6834" fill-opacity="0.25" stroke="#eb6834" stroke-width="2"/>
<text x="430" y="284" font-size="15" fill="#eb6834" text-anchor="middle" font-weight="bold" font-style="italic">ΔP<tspan dy="4" font-size="75%">Cu</tspan><tspan dy="-4"> </tspan></text>
<text x="430" y="302" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">ztráty ve vinutí → teplo</text>
<text x="410" y="70" font-size="16" fill="#1c1f26" text-anchor="middle" font-weight="normal" font-style="italic">P₁ = P₂ + ΔP<tspan dy="4" font-size="75%">Fe</tspan><tspan dy="-4"> </tspan> + ΔP<tspan dy="4" font-size="75%">Cu</tspan><tspan dy="-4"> </tspan></text>
